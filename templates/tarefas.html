<html>
    <head>
       <title>Minhas tarefas.</title>
    </head>
    <body>
             Aqui fica a lista de tarefas-

             {% if lista %}
             <ol> 
                 {% for item in lista %}
                    <li> {{item}}</li>
                    <a href="/delete/{{loop.index0}}"><button> Excluir </button> </a>
                 {% endfor %}
             </ol>
            {% else %}
              <p>Não há itens! Parabéns! Você fez todas as tarefas </p>
            {% endif %}
            
         <form action="/add" method="post">
            <input type="text" name="nova">
            <button type="submit">Adicionar</button>
         </form>  
    </body>
</html>
